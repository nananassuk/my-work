<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연차관리 · 강남대성기숙 QUETTA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  --bg:#F3F6F5; --card:#FFFFFF; --ink:#1D2B2A; --sub:#5E706E; --line:#DCE5E3; --soft:#EDF3F2;
  --teal:#2BADA0; --deep:#1E7F76; --gold:#D4BE52; --goldbg:#FBF6DF; --warn:#B7791F; --warnbg:#FDF3E1;
  --annual:#CDEFEA; --special:#F3EBC2; --official:#D6E4F0; --cond:#E3DDF0; --sick:#DFE4E8; --mat:#F0DDE8;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em} h3{font-size:15px;margin:22px 0 10px;font-weight:700} h4{margin:18px 0 8px;font-size:14px}
h2 small,h3 small{font-weight:500;color:var(--sub);font-size:13px;margin-left:6px}
a{color:var(--deep);text-decoration:none;font-weight:600} a:hover{text-decoration:underline}
.muted{color:var(--sub)} .small{font-size:12.5px} .hint{color:var(--sub);font-size:12.5px}
.neg{color:var(--warn)!important;font-weight:700}

/* login */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#1E7F76 0%,#2BADA0 55%,#D4BE52 140%)}
.lbox{background:#fff;padding:44px 40px;border-radius:18px;width:min(380px,92vw);text-align:center;box-shadow:0 20px 50px rgba(15,60,55,.25)}
.lbox .mark{font-size:44px;font-weight:800;letter-spacing:-.04em;color:var(--deep);line-height:1}
.lbox .mark span{color:var(--gold)}
.lbox p{color:var(--sub);margin:10px 0 26px}
#loginMsg{color:var(--warn);font-size:13px;margin-top:14px;min-height:18px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
.top .row{display:flex;align-items:center;gap:14px;padding:10px 22px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.03em;margin-right:6px}.brand span{color:var(--gold)}
.top select,.top input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px}
.top select option{color:var(--ink)} .top label{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.top input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}
.top .sp{flex:1} #who{font-size:12.5px;opacity:.8}
#tabs{display:flex;gap:2px;padding:0 16px;overflow-x:auto;background:#176A62}
#tabs button{background:none;border:0;color:rgba(255,255,255,.75);padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;position:relative}
#tabs button.on{color:#fff;border-bottom-color:var(--gold)} #tabs button:hover{color:#fff}
#ackBadge{display:inline-block;background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;border-radius:10px;padding:0 6px;margin-left:4px;line-height:17px}
main{padding:22px;max-width:1700px;margin:0 auto}

/* buttons */
.btn{background:var(--deep);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#176A62} .btn:focus-visible,.link:focus-visible,#tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.ghost{background:#fff;color:var(--deep);border:1px solid var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 11px;font-size:12.5px} .btn.danger{color:var(--warn)}
.btn.light{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)} .btn.light:hover{background:rgba(255,255,255,.24)}
.link{background:none;border:0;color:var(--deep);font-weight:600;cursor:pointer;padding:2px 4px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;min-width:200px}
.bar h2{margin-right:auto}

/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.hero p{margin:4px 0 0;color:var(--sub)}
.stats{display:flex;gap:10px;margin:0;flex-wrap:wrap}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;min-width:120px}
.stats dt{font-size:12px;color:var(--sub)} .stats dd{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats dd small{font-size:13px;font-weight:600;margin-left:2px;color:var(--sub)} .stats dd.sm{font-size:16px;padding-top:6px}

/* tables */
.tblwrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 230px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.tblwrap.full{overflow:visible;max-height:none}
.tblwrap.full .grid th{top:var(--hdr,94px)}
.tblwrap.full .grid thead th:first-child{border-top-left-radius:12px}.tblwrap.full .grid thead th:last-child{border-top-right-radius:12px}
.cnt{color:var(--deep);font-size:13px}
.bar .sp{flex:1} .bar .chkl input{min-width:0;width:auto;padding:0;margin:0} .chkl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
.bar h2{margin-right:0}
.grid td.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.grid tr.kept td{color:var(--sub)}
.grid th{background:var(--soft);font-weight:700;font-size:12.5px;color:#34504D;padding:8px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;white-space:nowrap}
.grid td{padding:7px 6px;border-bottom:1px solid #EEF2F1;text-align:center;white-space:nowrap}
.grid .l{text-align:left;padding-left:12px} .grid td.t{white-space:normal;min-width:260px;max-width:520px;font-size:13px}
.grid tbody tr:hover td{background:#F7FBFA}
.grid td small{display:block;color:var(--sub);font-size:11px;font-weight:400}
.grid .b{font-weight:700} .grid .m{color:#36514E;font-size:12.5px;min-width:34px}
.grid td.empty,.empty{color:var(--sub);text-align:center;padding:36px;white-space:normal}
.empty.ok{color:var(--deep);font-weight:600}
sup{color:var(--gold);font-weight:800;margin-left:2px}
.adj{background:var(--goldbg);padding:1px 6px;border-radius:5px;font-weight:600}
.grid.list td{text-align:center} .grid.list td.l{text-align:left}

/* month */
.months{display:flex;gap:4px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--sub)}
.months button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
.legend span{margin-right:8px}
.grid.month td,.grid.month th{padding:4px 2px;min-width:30px} .grid.month .nm{min-width:110px;position:sticky;left:0;background:#fff;z-index:1}
.grid.month th.nm{background:var(--soft);z-index:3}
.grid.month th.d small{display:block;font-weight:500;font-size:10px}
.grid.month .we,.grid.month .ho{background:#F1F4F3} .grid.month th.we,.grid.month th.ho{color:#8A9C99}
.grid.month td.d{cursor:pointer;height:34px} .grid.month td.d:hover{background:#E6F5F3}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 4px;border-radius:6px;font-size:12px;font-weight:800;color:#24403D;line-height:1}
.chip i{font-style:normal;font-size:9px;font-weight:700;margin-left:1px;opacity:.75}
.chip.half{background-image:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.75) 50%)}
.k-annual{background:var(--annual)} .k-special{background:var(--special)} .k-official{background:var(--official)}
.k-cond{background:var(--cond)} .k-sick{background:var(--sick)} .k-mat,.k-child{background:var(--mat)}
td .chip+.chip{margin-left:2px}

/* person */
.person header h2{font-size:26px} .person header p{margin:4px 0 16px;color:var(--sub)}
.sumline{display:flex;flex-wrap:wrap;gap:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sumline div{padding:12px 18px;border-right:1px solid var(--line);min-width:100px}
.sumline div:last-child{border:0} .sumline span{display:block;font-size:12px;color:var(--sub)} .sumline b{font-size:22px;font-variant-numeric:tabular-nums}
.sumline .eq{background:#F0F9F7} .sumline .eq b{color:var(--deep)}
.kinds{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px;font-size:13px}
.hist{list-style:none;padding:0;margin:0} .hist li{padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
.tag{font-style:normal;font-size:11px;background:var(--goldbg);color:#7A6513;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:700}

/* upload */
.upl{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px}
.drop{border:2px dashed #A9C9C4;border-radius:14px;background:#fff;padding:34px;text-align:center;position:relative;cursor:pointer}
.drop.over{border-color:var(--teal);background:#EFFAF8} .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop p{margin:4px 0}
.lastbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px 14px} .lastbox h3{margin-top:12px}
.lastbox table td{font-size:13px}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sumrow div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
.sumrow span{display:block;font-size:12px;color:var(--sub)} .sumrow b{font-size:22px}
.sumrow .ok{border-color:#9FD8D0;background:#F0FAF8} .sumrow .warn{border-color:#EBCB8B;background:var(--warnbg)}
.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
.issue{background:#fff;border:1px solid #EBCB8B;border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px}
.issue.accept{border-color:#9FD8D0;border-left-color:var(--teal);background:#F7FCFB} .issue.exclude{opacity:.55;border-left-color:#9AAAA8;border-color:var(--line)}
.issue .ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .issue p{margin:4px 0}
.issue ul{margin:6px 0 10px;padding-left:18px;color:var(--warn);font-weight:600;font-size:13px}
.ifoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap} .ifoot .btn{margin-left:6px}
details{margin:16px 0} summary{cursor:pointer;font-weight:700;color:var(--deep);margin-bottom:10px}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px} .actions span{flex:1}
.actions.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;justify-content:flex-end}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form.inline{grid-template-columns:repeat(4,1fr);gap:8px} .form.inline label{font-size:11.5px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub);font-weight:600}
.form label small{font-weight:400}
.form input,.form select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);font-weight:500}
.form .full{grid-column:1/-1} .form .chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1;color:var(--ink)}
.form.inline .chk{grid-column:auto;align-self:end;padding-bottom:7px}
.form .hl{background:var(--goldbg);padding:10px;border-radius:9px}
.calc{color:var(--sub);font-size:13px} .calc b{color:var(--ink)}
textarea{width:100%;font-family:inherit}

/* ack / retired / settings */
.ack header{align-items:flex-start} .ack header p{margin:4px 0 0}
.pill{display:inline-block;background:var(--goldbg);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;font-weight:700;font-size:12.5px}
td.big{font-size:18px;color:var(--deep)}
.ret{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ret header{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px} .ret header b{font-size:16px} .ret header span{color:var(--sub);font-size:13px}
.yrs{display:flex;flex-direction:column;gap:6px}
.yr{display:flex;gap:18px;flex-wrap:wrap;padding:7px 12px;background:var(--soft);border-radius:8px;font-size:13px}
.yr b{min-width:52px} .yr em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums} .yr .pay{color:var(--deep)}
.settings article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.settings article>p{margin:6px 0 12px}
.imp input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100px} .imp input.n{width:64px} .imp input[type=date]{width:140px}
.imp tr.note td{background:#FFFCF2}
.sec{margin:6px 0 0;padding-left:18px} .sec li{margin:4px 0} code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px}

/* modal, toast, busy */
#modal{position:fixed;inset:0;background:rgba(20,40,38,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:60px 16px;overflow:auto}
#modal.on{display:flex} #modalBox{background:#fff;border-radius:16px;padding:22px 24px;width:min(560px,100%);box-shadow:0 24px 60px rgba(0,0,0,.25)}
#modal.wide #modalBox{width:min(900px,100%)} #modalBody h3{margin-top:0;font-size:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:70;font-weight:700;color:var(--deep);gap:10px}
#busy.on{display:flex} #busy i{width:18px;height:18px;border:3px solid var(--teal);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#busy i{animation:none}#toast{transition:none}}
@media (max-width:900px){.upl{grid-template-columns:1fr}.issues{grid-template-columns:1fr}.form.inline{grid-template-columns:1fr 1fr}main{padding:14px}}
</style>
</head>
<body>
<section id="login">
  <div class="lbox">
    <div class="mark">연차<span>.</span></div>
    <p>강남대성기숙 QUETTA 연차관리</p>
    <button class="btn" id="loginBtn">Google 계정으로 로그인</button>
    <div id="loginMsg"></div>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="row">
      <div class="brand">연차관리<span>.</span></div>
      <select id="yearSel" aria-label="연도 선택"></select>
      <label>기준일 <input type="date" id="asOf"></label>
      <button class="btn light sm" id="exportBtn">엑셀 다운로드</button>
      <span class="sp"></span><span id="who"></span><button class="btn light sm" id="logoutBtn">로그아웃</button>
    </div>
    <nav id="tabs">
      <button data-tab="dash">연차 현황</button>
      <button data-tab="month">월별 연차이력</button>
      <button data-tab="person">직원별 이력</button>
      <button data-tab="upload">연차반영 업로드</button>
      <button data-tab="ack">월차 반영 체크<span id="ackBadge" hidden></span></button>
      <button data-tab="emps">사원 관리</button>
      <button data-tab="retired">퇴사자</button>
      <button data-tab="settings">설정</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modalBox"><div id="modalBody"></div></div></div>
<div id="toast" role="status"></div>
<div id="busy"><i></i><span id="busyMsg">처리 중</span></div>

<script>
function setHdr(){const t=document.querySelector(".top");if(t)document.documentElement.style.setProperty("--hdr",t.offsetHeight+"px");}
window.addEventListener("resize",setHdr);

/* ===== 휴가 종류 ===== */
const KINDS = {
  annual:     { label:'연차/반차', full:'연', half:'반',  deduct:true,  cls:'k-annual' },
  special:    { label:'특별휴가',  full:'특', half:'특반', deduct:false, cls:'k-special' },
  official:   { label:'공무/훈련', full:'공', half:'공',  deduct:false, cls:'k-official' },
  condolence: { label:'경조휴가',  full:'경', half:'경',  deduct:false, cls:'k-cond' },
  sick:       { label:'병가',      full:'병', half:'병',  deduct:false, cls:'k-sick' },
  maternity:  { label:'출산휴가',  full:'출', half:'출',  deduct:false, cls:'k-mat' },
  childcare:  { label:'육아휴직',  full:'육', half:'육',  deduct:false, cls:'k-child' },
};
const CAT_MAP = { '연차/반차':'annual','특별휴가':'special','공무/훈련':'official','경조휴가':'condolence','병가':'sick','출산휴가':'maternity','육아휴직':'childcare' };
const OLD_RULE_LAST = '2017-05-29';

/* ===== 날짜 유틸 (문자열 YYYY-MM-DD 기준, 시간대 영향 없음) ===== */
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const pYMD = s => s.split('-').map(Number);
const dnum = s => { const [y,m,d]=pYMD(s); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const fromDnum = n => { const t=new Date(n*864e5); return ymd(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()); };
const addDays = (s,k) => fromDnum(dnum(s)+k);
const dow = s => new Date(dnum(s)*864e5).getUTCDay();
const lastDay = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
function addMonths(s,k){
  let [y,m,d]=pYMD(s); m+=k; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1;
  return ymd(y,m,Math.min(d,lastDay(y,m)));
}
function normDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date) return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){ return fromDnum(Math.round(v)-25569); }
  const m=String(v).trim().match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  return m ? ymd(+m[1],+m[2],+m[3]) : '';
}
const isOff = (s,hol) => { const w=dow(s); return w===0||w===6||hol.has(s); };

/* ===== 휴가 일자 계산 ===== */
// sPart/ePart: '하루' | '오전' | '오후'
function computeDates(start,end,sPart,ePart,weekend,hol){
  const out=[]; if(!start||!end||end<start) return out;
  const n=dnum(end)-dnum(start);
  if(n>400) return out;
  for(let i=0;i<=n;i++){
    const d=addDays(start,i);
    if(!weekend && isOff(d,hol)) continue;
    let a=1,p='';
    if(n===0){
      if(sPart!=='하루'||ePart!=='하루'){ a=0.5; p=(sPart!=='하루'?sPart:ePart); }
    } else if(i===0 && sPart==='오후'){ a=0.5; p='오후'; }
    else if(i===n && ePart==='오전'){ a=0.5; p='오전'; }
    out.push({d,a,p});
  }
  return out;
}
const sumDays = dates => dates.reduce((s,x)=>s+x.a,0);
const dayCode = (kind,a) => { const k=KINDS[kind]||KINDS.annual; return a<1 ? k.half : k.full; };

/* ===== 연차 계산 ===== */
const hireYear = e => +e.hire.slice(0,4);
const isOldRule = e => e.hire <= OLD_RULE_LAST;
function monthlyDates(e){
  const out=[]; if(!e.hire) return out;
  for(let k=1;k<=11;k++){ const d=addMonths(e.hire,k); if(e.resign && d>e.resign) break; out.push(d); }
  return out;
}
const monthlyIn = (e,Y,asOf) => monthlyDates(e).filter(d=>d.startsWith(Y+'-') && d<=asOf).length;
// 0.5 단위 반올림: 소수 첫째자리 기준 .0~.2 → 버림, .3~.7 → .5, .8~.9 → 올림
function round05(v){
  const r=Math.round(v*10)/10, i=Math.floor(r+1e-9), f=Math.round((r-i)*10);
  return f<3 ? i : (f<8 ? i+0.5 : i+1);
}
function grantOf(e,Y){
  const hy=hireYear(e); if(Y<=hy) return 0;
  if(e.resign && e.resign < `${Y}-01-01`) return 0;
  const N=Y-hy+1, days=dnum(`${hy}-12-31`)-dnum(e.hire)+1;
  if(!isOldRule(e)){
    if(N===2) return round05(days/365*15);
    return Math.min(25, 15+Math.floor((N-3)/2));
  }
  if(N===2){ const v=days/(isLeap(hy)?366:365)*15 - monthlyIn(e,hy,`${hy}-12-31`); return Math.max(0,Math.round(v*10)/10); }
  if(N===3) return Math.max(0, 15 - monthlyIn(e,hy+1,`${hy+1}-12-31`));
  return Math.min(25, 15+Math.floor((N-3)/2));
}
function usedIn(e,Y,leaves){
  let s=0;
  for(const l of leaves){ if(l.status!=='ok' || !KINDS[l.kind]?.deduct) continue;
    for(const x of l.dates) if(x.d.startsWith(Y+'-')) s+=x.a; }
  return s + (+(e.manualUsed?.[Y])||0);
}
function summaryOf(e,Y,asOf,leaves){
  if(!e.hire) return null;
  const hy=hireYear(e); if(Y<hy) return null;
  const eff = e.resign && e.resign<asOf ? e.resign : asOf;
  const carry = (!isOldRule(e) && Y===hy+1) ? Math.max(0, monthlyIn(e,hy,`${hy}-12-31`) - usedIn(e,hy,leaves)) : 0;
  const monthly = monthlyIn(e,Y,eff);
  const grant = grantOf(e,Y);
  const adj = +(e.adj?.[Y]?.days)||0;
  const avail = carry+monthly+grant+adj;
  const used = usedIn(e,Y,leaves);
  const months = Array(12).fill(0);
  const kindCount = {};
  for(const l of leaves){ if(l.status!=='ok') continue;
    for(const x of l.dates){ if(!x.d.startsWith(Y+'-')) continue;
      kindCount[l.kind]=(kindCount[l.kind]||0)+x.a;
      if(KINDS[l.kind]?.deduct) months[+x.d.slice(5,7)-1]+=x.a; } }
  const monthlyPool=carry+monthly, annualPool=grant+adj;
  const payRemain = Math.max(0, annualPool - Math.max(0, used-monthlyPool));
  return { N:Y-hy+1, carry, monthly, grant, adj, avail, used, remain:avail-used, payRemain, months, kindCount, old:isOldRule(e) };
}

/* ===== 업로드 파일 분석 ===== */
const nospace = s => String(s||'').replace(/\s+/g,'');
function titleKind(t){
  const s=nospace(t).replace(/^\[[^\]]*\]/,'');
  if(s.includes('육아휴직')) return 'childcare';
  if(s.includes('출산')) return 'maternity';
  if(s.includes('병가')) return 'sick';
  if(s.includes('경조')) return 'condolence';
  if(s.includes('공무')||s.includes('훈련')) return 'official';
  if(s.includes('특별')) return 'special';
  if(s.includes('연차')||s.includes('반차')) return 'annual';
  return null;
}
const titleHalf = t => /반차|오전|오후/.test(nospace(t).replace(/^\[[^\]]*\]/,''));
function titleDates(t){
  const s=String(t||'').replace(/^\s*\[[^\]]*\]/,'');
  const re=/(20\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/;
  const m=s.match(re); if(!m) return null;
  const y=+m[1], start=ymd(y,+m[2],+m[3]);
  const rest=s.slice(m.index+m[0].length);
  const r=rest.match(/^\.?\s*(?:\(\s*\d+(?:\.\d+)?\s*일\s*\))?\s*(?:[~∼～]|-(?=\s*20\d{2}))\s*(?:(20\d{2})\s*[.\-\/]\s*)?(?:(\d{1,2})\s*[.\-\/]\s*)?(\d{1,2})(?!\d)/);
  const end = r ? ymd(r[1]?+r[1]:y, r[2]?+r[2]:+m[2], +r[3]) : start;
  return { start, end };
}
const titleN = t => { const m=String(t||'').match(/\(\s*(\d+(?:\.\d+)?)\s*일\s*\)/); return m?+m[1]:null; };
function parsePeriod(p){
  const m=String(p||'').match(/(\d{4}-\d{2}-\d{2})\s*\((하루|오전|오후)\)\s*~\s*(\d{4}-\d{2}-\d{2})\s*\((하루|오전|오후)\)/);
  return m ? { start:m[1], sPart:m[2], end:m[3], ePart:m[4] } : null;
}
function hashKey(str){ let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36); }
function leaveKey(docNo,name,period,title){ const d=String(docNo||'').trim(); return d ? 'doc:'+d : 'raw:'+name+'|'+period+'|'+nospace(title); }

// 헤더 이름 기반으로 행 읽기
function readUploadRows(aoa){
  let h=-1; for(let i=0;i<Math.min(aoa.length,10);i++){ const r=(aoa[i]||[]).map(nospace); if(r.includes('제목')&&r.includes('휴가기간')){h=i;break;} }
  if(h<0) throw new Error('헤더(제목, 휴가 기간, 구분, 상태, 기안자, 기안일)를 찾지 못했습니다.');
  const H=aoa[h].map(nospace), col=n=>H.indexOf(n);
  const c={doc:col('문서번호'),title:col('제목'),period:col('휴가기간'),cat:col('구분'),status:col('상태'),drafter:col('기안자'),draft:col('기안일')};
  const rows=[];
  for(let i=h+1;i<aoa.length;i++){ const r=aoa[i]||[]; if(!r[c.title]&&!r[c.period]) continue;
    rows.push({ docNo:String(r[c.doc]??'').trim(), title:String(r[c.title]??'').trim(), period:String(r[c.period]??'').trim(),
      cat:String(r[c.cat]??'').trim(), status:String(r[c.status]??'').trim(), drafter:String(r[c.drafter]??'').trim(), draft:String(r[c.draft]??'').trim() }); }
  return rows;
}

function analyzeRow(r,emps,hol){
  const name=r.drafter.split('/')[0].trim(), dept=(r.drafter.split('/')[1]||'').trim();
  const per=parsePeriod(r.period);
  const cands=emps.filter(e=>e.name===name);
  const emp = cands.length===1 ? cands[0] : (cands.find(e=>!e.resign) || null);
  const catKind=CAT_MAP[nospace(r.cat)]||null, tKind=titleKind(r.title), tD=titleDates(r.title), tN=titleN(r.title), tHalf=titleHalf(r.title);
  const issues=[];
  if(!cands.length) issues.push(`등록되지 않은 직원: ${name}`);
  else if(cands.length>1) issues.push(`동명이인 ${cands.length}명 — 직원을 선택하세요`);
  if(!per) issues.push('휴가 기간 형식을 읽지 못함');
  if(!catKind) issues.push(`구분 값 인식 불가: ${r.cat||'(비어있음)'}`);
  if(!tKind) issues.push('제목에서 휴가 종류를 찾지 못함');
  else if(catKind && tKind!==catKind) issues.push(`제목 종류(${KINDS[tKind].label}) ≠ 구분(${KINDS[catKind].label})`);
  let dates=[];
  if(per){
    if(!tD) issues.push('제목에서 날짜를 찾지 못함');
    else if(tD.start!==per.start || tD.end!==per.end) issues.push(`제목 날짜(${tD.start===tD.end?tD.start:tD.start+'~'+tD.end}) ≠ 휴가기간(${per.start===per.end?per.start:per.start+'~'+per.end})`);
    const single=per.start===per.end;
    if(single && tHalf && per.sPart==='하루' && per.ePart==='하루') issues.push('제목은 반차인데 휴가기간은 하루');
    if(single && !tHalf && (per.sPart!=='하루'||per.ePart!=='하루')) issues.push(`휴가기간은 반차(${per.sPart!=='하루'?per.sPart:per.ePart})인데 제목에 반차 표기 없음`);
    dates=computeDates(per.start,per.end,per.sPart,per.ePart,false,hol);
    const n=sumDays(dates);
    if(tN!==null && Math.abs(tN-n)>1e-9) issues.push(`제목 일수(${tN}일) ≠ 계산 일수(${n}일, 주말·공휴일 제외)`);
    if(per.start!==per.end && !dates.length) issues.push('기간 내 평일이 없음 — 주말 포함 여부 확인');
  }
  return { key:leaveKey(r.docNo,name,r.period,r.title), raw:r, name, dept, empId:emp?emp.id:'', kind:catKind||tKind||'annual',
    start:per?.start||'', end:per?.end||'', sPart:per?.sPart||'하루', ePart:per?.ePart||'하루', weekend:false, dates, issues };
}

function monthCells(Y,M){
  const n=lastDay(Y,M), days=[...Array(n)].map((_,i)=>ymd(Y,M,i+1));
  const emps=empList().filter(e=>e.hire && e.hire<=ymd(Y,M,n) && (!e.resign||e.resign>=ymd(Y,M,1))).sort(empSort);
  const map={}; Object.values(S.leaves).forEach(l=>{ if(l.status!=='ok') return; l.dates.forEach(x=>{ if(x.d.startsWith(`${Y}-${pad(M)}`)) (map[l.empId+'|'+x.d]=map[l.empId+'|'+x.d]||[]).push({l,x}); }); });
  return {days,emps,map};
}
function renderMonth(v){
  const Y=S.year,M=S.month,{days,emps,map}=monthCells(Y,M);
  const head=days.map(d=>{ const w=dow(d); return `<th class="d ${w===0||w===6?'we':''} ${S.hol.has(d)?'ho':''}">${+d.slice(8)}<small>${'일월화수목금토'[w]}</small></th>`; }).join('');
  const body=emps.map(e=>{ const c={annual:0,half:0,special:0,official:0,etc:0};
    const cells=days.map(d=>{ const it=map[e.id+'|'+d]||[]; it.forEach(({l,x})=>{ if(l.kind==='annual'){ x.a<1?c.half++:c.annual++; } else if(l.kind==='special') c.special+=x.a; else if(l.kind==='official') c.official+=x.a; else c.etc+=x.a; });
      const w=dow(d); return `<td class="d ${w===0||w===6?'we':''} ${S.hol.has(d)?'ho':''}" onclick="cellClick('${e.id}','${d}')">${it.map(({l,x})=>chip(l.kind,x.a,x.p)).join('')}</td>`; }).join('');
    return `<tr><td class="l nm"><a href="#" onclick="goPerson('${e.id}');return false">${esc(e.name)}</a><small>${esc(e.dept)}</small></td>${cells}<td>${c.annual||''}</td><td>${c.half||''}</td><td>${c.special?num(c.special):''}</td><td>${c.official?num(c.official):''}</td><td>${c.etc?num(c.etc):''}</td></tr>`; }).join('');
  v.innerHTML=`<div class="bar"><div class="months">${[...Array(12)].map((_,i)=>`<button class="${i+1===M?'on':''}" onclick="S.month=${i+1};render()">${i+1}월</button>`).join('')}</div></div>
  <div class="legend">${Object.entries(KINDS).map(([k,o])=>`${chip(k,1)}<span>${o.label}</span>`).join('')}${chip('annual',0.5,'오전')}<span>오전반차</span>${chip('annual',0.5,'오후')}<span>오후반차</span><span class="hint">칸을 누르면 그 날짜로 휴가를 직접 추가할 수 있어요.</span></div>
  <div class="tblwrap"><table class="grid month"><thead><tr><th class="l nm">${Y}년 ${M}월</th>${head}<th>연</th><th>반</th><th>특</th><th>공</th><th>기타</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function cellClick(empId,d){
  const its=Object.values(S.leaves).filter(l=>l.empId===empId&&l.status==='ok'&&l.dates.some(x=>x.d===d));
  if(its.length) return leaveModal(its[0].id);
  leaveModal(null,{empId,start:d,end:d});
}

   <h3>${Y}년 휴가 사용 이력 <small>${ls.length}건</small></h3>

function bindPq(){ const p=$('#pq'); if(!p) return; p.onchange=()=>{ const m=p.value.match(/\(([^)]+)\)\s*$/); const f=empList().find(x=>m?String(x.no)===m[1]:x.name===p.value.trim()); if(f){ S.person=f.id; render(); } }; }

/* ===== 휴가 추가/수정 모달 ===== */

    <label>직원<select id="lfE">${emps.map(e=>`<option value="${e.id}" ${e.id===l.empId?'selected':''}>${esc(e.name)} (${esc(e.dept)})</option>`).join('')}</select></label>

    <label>시작일<input type="date" id="lfS" value="${l.start}"></label><label>시작 구분${partSel('lfSP',l.sPart)}</label>
    <label>종료일<input type="date" id="lfEnd" value="${l.end}"></label><label>종료 구분${partSel('lfEP',l.ePart)}</label>
    <label class="chk"><input type="checkbox" id="lfW" ${l.weekend?'checked':''}> 주말·공휴일도 휴가일수에 포함</label>
    <label class="full">메모<input id="lfM" value="${esc(l.memo||'')}"></label>

   <div class="actions">${id?`<button class="btn ghost danger" onclick="deleteLeave('${id}')">삭제</button>`:''}<span></span><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="saveLeave(${id?`'${id}'`:'null'})">저장</button></div>`);
  ['lfS','lfEnd','lfSP','lfEP','lfW','lfK'].forEach(i=>$('#'+i).oninput=calcPreview); calcPreview();
}
const partSel=(id,v)=>`<select id="${id}">${['하루','오전','오후'].map(p=>`<option ${p===v?'selected':''}>${p}</option>`).join('')}</select>`;
function readLeaveForm(){ return { empId:$('#lfE').value, kind:$('#lfK').value, start:$('#lfS').value, end:$('#lfEnd').value, sPart:$('#lfSP').value, ePart:$('#lfEP').value, weekend:$('#lfW').checked, memo:$('#lfM').value.trim() }; }
function calcPreview(){ const f=readLeaveForm(); const d=computeDates(f.start,f.end,f.sPart,f.ePart,f.weekend,S.hol);
  $('#lfCalc').innerHTML = f.end<f.start ? '종료일이 시작일보다 빠릅니다.' : `계산 일수 <b>${num(sumDays(d))}일</b> ${d.map(x=>chip(f.kind,x.a,x.p)).join('')}`; }
async function saveLeave(id){
  const f=readLeaveForm(); if(!f.empId||!f.start||!f.end||f.end<f.start) return toast('직원과 기간을 확인하세요.');
  const dates=computeDates(f.start,f.end,f.sPart,f.ePart,f.weekend,S.hol); if(!dates.length) return toast('휴가일수가 0일입니다. 주말 포함 여부를 확인하세요.');
  const data={...f,dates,days:sumDays(dates),status:'ok',updatedAt:new Date().toISOString()};
  try{ if(id){ await db.collection('leaves').doc(id).set(data,{merge:true}); S.leaves[id]={...S.leaves[id],...data}; }
    else { data.src='manual'; data.createdAt=data.updatedAt; data.key='manual:'+Date.now(); const r=await db.collection('leaves').add(data); S.leaves[r.id]={id:r.id,...data}; }
    closeModal(); toast('저장했습니다.'); render(); }catch(e){ toast('저장 실패: '+e.message); }
}
async function deleteLeave(id){
  const l=S.leaves[id]; if(!confirm('이 휴가 기록을 삭제할까요?'+(l.docNo?'\n(그룹웨어 문서는 다음 업로드 때 다시 반영되지 않도록 제외 처리됩니다.)':''))) return;
  try{ if(l.docNo){ await db.collection('leaves').doc(id).set({status:'excluded',excludedAt:new Date().toISOString()},{merge:true}); S.leaves[id].status='excluded'; }
    else { await db.collection('leaves').doc(id).delete(); delete S.leaves[id]; }
    closeModal(); toast('삭제했습니다.'); render(); }catch(e){ toast('삭제 실패: '+e.message); }
}

     <div class="issues">${flag.map(i=>issueCard(i)).join('')}</div>`:''}
     <details ${flag.length?'':'open'}><summary>바로 반영되는 건 ${clean.length}건 보기</summary><div class="tblwrap"><table class="grid list"><thead><tr><th>기안일</th><th>이름</th><th>기간</th><th>종류</th><th>일수</th><th class="l">제목</th></tr></thead><tbody>
     ${clean.map(i=>`<tr><td>${esc(i.raw.draft)}</td><td>${esc(i.name)}</td><td>${i.start===i.end?i.start:i.start+'~'+i.end}</td><td>${KINDS[i.kind].label}</td><td>${num(sumDays(i.dates))}</td><td class="l t">${esc(i.raw.title)}</td></tr>`).join('')}</tbody></table></div></details>
     <div class="actions sticky"><button class="btn ghost" onclick="S.upload=null;render()">취소</button><button class="btn" onclick="commitUpload()">${clean.length+flag.filter(i=>i.decision==='accept').length}건 반영하기${flag.filter(i=>i.decision==='exclude').length?` · ${flag.filter(i=>i.decision==='exclude').length}건 제외`:''}</button></div></section>`;

  d.ondrop=e=>{e.preventDefault();d.classList.remove('over'); e.dataTransfer.files[0]&&handleUpload(e.dataTransfer.files[0]);};

function issueCard(i){
  const idx=S.upload.items.indexOf(i), emps=empList().sort((a,b)=>a.name.localeCompare(b.name));
  const dates=computeDates(i.start,i.end,i.sPart,i.ePart,i.weekend,S.hol);
  return `<div class="issue ${i.decision||''}" id="iss${idx}">
   <div class="ih"><b>${esc(i.name)}</b> <span class="muted">${esc(i.raw.draft)} · ${esc(i.raw.docNo)}</span>${i.decision?`<em class="tag">${i.decision==='accept'?'반영 예정':'제외 예정'}</em>`:''}</div>
   <p class="t">${esc(i.raw.title)}</p><p class="muted small">휴가 기간 ${esc(i.raw.period)} · 구분 ${esc(i.raw.cat)}</p>
   <ul>${i.issues.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
   <div class="form inline">
    <label>직원<select onchange="updIss(${idx},'empId',this.value)"><option value="">선택</option>${emps.map(e=>`<option value="${e.id}" ${e.id===i.empId?'selected':''}>${esc(e.name)} (${esc(e.dept)})</option>`).join('')}</select></label>
    <label>종류<select onchange="updIss(${idx},'kind',this.value)">${Object.entries(KINDS).map(([k,o])=>`<option value="${k}" ${k===i.kind?'selected':''}>${o.label}</option>`).join('')}</select></label>
    <label>시작<input type="date" value="${i.start}" onchange="updIss(${idx},'start',this.value)"></label><label>구분<select onchange="updIss(${idx},'sPart',this.value)">${['하루','오전','오후'].map(p=>`<option ${p===i.sPart?'selected':''}>${p}</option>`).join('')}</select></label>
    <label>종료<input type="date" value="${i.end}" onchange="updIss(${idx},'end',this.value)"></label><label>구분<select onchange="updIss(${idx},'ePart',this.value)">${['하루','오전','오후'].map(p=>`<option ${p===i.ePart?'selected':''}>${p}</option>`).join('')}</select></label>
    <label class="chk"><input type="checkbox" ${i.weekend?'checked':''} onchange="updIss(${idx},'weekend',this.checked)"> 주말 포함</label>
   </div>
   <div class="ifoot"><span class="calc">반영 일수 <b>${num(sumDays(dates))}일</b> ${dates.slice(0,8).map(x=>chip(i.kind,x.a,x.p)).join('')}</span>
    <span><button class="btn ghost" onclick="decide(${idx},'exclude')">제외</button><button class="btn" onclick="decide(${idx},'accept')">반영</button></span></div></div>`;
}
function updIss(idx,k,v){ const i=S.upload.items[idx]; i[k]=v; i.decision=null; $('#iss'+idx).outerHTML=issueCard(i); }
function decide(idx,d){ const i=S.upload.items[idx];
  if(d==='accept'){ if(!i.empId) return toast('직원을 선택하세요.'); if(!i.start||!i.end||i.end<i.start) return toast('기간을 확인하세요.');
    if(!computeDates(i.start,i.end,i.sPart,i.ePart,i.weekend,S.hol).length) return toast('반영 일수가 0일입니다.'); }
  i.decision = i.decision===d ? null : d; renderUpload($('#view')); document.getElementById('iss'+idx)?.scrollIntoView({block:'center'}); }
async function handleUpload(file){
  busy(true,'파일 분석 중');
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    const rows=readUploadRows(aoa);
    const existing=new Set(Object.values(S.leaves).map(l=>l.key));
    const emps=empList(); let skipped=0, dup=0; const items=[];
    for(const r of rows){
      if(!r.status.startsWith('완료')){ skipped++; continue; }
      const it=analyzeRow(r,emps,S.hol);
      if(existing.has(it.key)){ dup++; continue; }
      items.push(it);
    }
    S.upload={total:rows.length,skipped,dup,items,file:file.name};
    if(!emps.length) toast('등록된 직원이 없습니다. 먼저 설정에서 사원을 불러오세요.');
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다: '+e.message); }
  busy(false); renderUpload($('#view'));
}
async function commitUpload(){
  const U=S.upload, now=new Date().toISOString(), ops=[], add=[];
  for(const i of U.items){
    let status;
    if(!i.issues.length || i.decision==='accept') status='ok'; else if(i.decision==='exclude') status='excluded'; else continue;
    if(status==='ok' && !i.empId) continue;
    const dates=status==='ok'?computeDates(i.start,i.end,i.sPart,i.ePart,i.weekend,S.hol):[];
    const id='g_'+hashKey(i.key);
    const data={key:i.key,src:'upload',status,empId:i.empId,name:i.name,kind:i.kind,start:i.start,end:i.end,sPart:i.sPart,ePart:i.ePart,weekend:!!i.weekend,
      dates,days:sumDays(dates),title:i.raw.title,cat:i.raw.cat,period:i.raw.period,docNo:i.raw.docNo,draft:i.raw.draft,draftDept:i.dept,
      edited:!!i.issues.length,issues:i.issues,createdAt:now,file:U.file};
    ops.push({ref:db.collection('leaves').doc(id),data,merge:false}); add.push([id,data]);
  }
  if(!ops.length) return toast('반영할 건이 없습니다.');
  busy(true,`${ops.length}건 저장 중`);
  try{ await commitBatch(ops); add.forEach(([id,d])=>S.leaves[id]={id,...d}); S.upload=null;
    toast(`${add.filter(a=>a[1].status==='ok').length}건 반영, ${add.filter(a=>a[1].status==='excluded').length}건 제외했습니다.`); buildYearSelect(); render(); }
  catch(e){ toast('저장 실패: '+e.message); }
  busy(false);
}

/* ================= 5. 월차 반영 체크 ================= */
// 기준: 마지막 '반영 완료' 이후 발생분. 반영 이력이 없으면 시스템 등록일 이후 발생분부터 집계
function pendingMonthly(e){ if(e.resign) return []; const t=todayStr(), th=e.ack?.through||(e.createdAt||'').slice(0,10); return monthlyDates(e).filter(d=>d<=t && d>th); }
function renderAck(v){
  const list=activeEmps().map(e=>({e,p:pendingMonthly(e),all:monthlyDates(e).filter(d=>d<=todayStr())})).filter(x=>x.all.length && x.all.length<11 || x.p.length);
  const pend=list.filter(x=>x.p.length), done=list.filter(x=>!x.p.length);
  v.innerHTML=`<section class="ack"><header class="bar"><div><h2>월차 반영 체크</h2><p class="muted">그룹웨어에 반영하지 않은 월차가 누적돼서 보여요. 반영한 뒤 <b>반영 완료</b>를 누르세요.</p></div>
   ${pend.length?`<button class="btn ghost" onclick="ackAll()">표시된 ${pend.length}명 모두 반영 완료</button>`:''}</header>
   ${pend.length?`<table class="grid list"><thead><tr><th class="l">이름</th><th class="l">부서</th><th>입사일</th><th>누적 월차</th><th class="l">미반영 발생일</th><th>미반영</th><th></th></tr></thead><tbody>
   ${pend.map(({e,p,all})=>`<tr><td class="l"><b>${esc(e.name)}</b></td><td class="l">${esc(e.dept)}</td><td>${e.hire}</td><td>${all.length} / 11</td><td class="l">${p.map(d=>`<span class="pill">${d.slice(5).replace('-','/')}</span>`).join('')}</td>
   <td class="b big">+${p.length}</td><td><button class="btn sm" onclick="ackOne('${e.id}')">반영 완료</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty ok">미반영 월차가 없습니다.</p>'}
   ${done.length?`<h3>월차 발생 중 · 반영 완료 <small>${done.length}명</small></h3><table class="grid list"><tbody>${done.map(({e,all})=>`<tr><td class="l">${esc(e.name)}</td><td class="l">${esc(e.dept)}</td><td>${all.length} / 11</td><td class="muted">${e.ack?.at?('마지막 반영 '+e.ack.at.slice(0,10)):''}</td><td>다음 발생 ${monthlyDates(e).find(d=>d>todayStr())||'—'}</td></tr>`).join('')}</tbody></table>`:''}
  </section>`;
}
async function ackOne(id){ const e=S.emps[id], p=pendingMonthly(e); if(!p.length) return;
  const ack={through:p[p.length-1],at:new Date().toISOString(),log:[...(e.ack?.log||[]),{at:new Date().toISOString(),count:p.length,through:p[p.length-1]}].slice(-30)};
  try{ await db.collection('emps').doc(id).set({ack},{merge:true}); e.ack=ack; toast(`${e.name} 월차 ${p.length}개 반영 완료`); render(); }catch(err){ toast('저장 실패: '+err.message); } }
async function ackAll(){ const L=activeEmps().filter(e=>pendingMonthly(e).length); if(!confirm(`${L.length}명의 미반영 월차를 모두 반영 완료로 표시할까요?`)) return;
  const now=new Date().toISOString(), ops=L.map(e=>{ const p=pendingMonthly(e); e.ack={through:p[p.length-1],at:now,log:[...(e.ack?.log||[]),{at:now,count:p.length,through:p[p.length-1]}].slice(-30)}; return {ref:db.collection('emps').doc(e.id),data:{ack:e.ack}}; });
  busy(true); try{ await commitBatch(ops); toast('모두 반영 완료로 표시했습니다.'); }catch(err){ toast('저장 실패: '+err.message); } busy(false); render(); }

/* ================= 6. 사원 관리 ================= */
function empFiltered(){
  const q=(S.empQ||'').trim().toLowerCase();
  const base=S.empRetired ? empList().slice().sort((a,b)=>(!!a.resign-!!b.resign)||empSort(a,b)) : activeEmps();
  return base.filter(e=>!q || [e.name,e.no,e.dept,e.rank].some(x=>String(x||'').toLowerCase().includes(q)));
}
function renderEmpBody(){
  const list=empFiltered(), total=S.empRetired?empList().length:activeEmps().length;
  $('#empBody').innerHTML = list.map(e=>`<tr class="${e.resign?'kept':''}" ondblclick="empModal('${e.id}')"><td>${esc(e.no)}</td><td class="l"><b>${esc(e.name)}</b>${e.resign?` <em class="tag">퇴사 ${e.resign}</em>`:''}</td><td class="l">${esc(e.dept)}</td><td>${esc(e.rank)}</td><td>${e.hire}</td><td>${isOldRule(e)?'2017.5.29 이전':'현행'}</td>
  <td>${e.adj?.[S.year]?.days?`<span title="${esc(e.adj[S.year].memo||'')}">${num(e.adj[S.year].days)}</span>`:''}</td><td>${(e.history||[]).length||''}</td><td><button class="btn sm ghost" onclick="empModal('${e.id}')">수정</button></td></tr>`).join('')
    || `<tr><td colspan="9" class="empty">${total?'검색 결과가 없습니다.':'등록된 사원이 없습니다.'}</td></tr>`;
  $('#empCount').textContent = list.length===total ? `${total}명` : `${list.length} / ${total}명`;
}
function renderEmps(v){
  v.innerHTML=`<section><div class="bar"><h2>사원 관리 <small>${activeEmps().length}명 재직</small></h2>

function empModal(id){

   <label>${Y-1}년 시스템 외 사용일수 <small>입사년도 월차 이월 계산용</small><input type="number" step="0.5" id="efMU0" value="${e.manualUsed?.[Y-1]??''}"></label></div>`:''}
  <div class="actions">${id?`<button class="btn ghost danger" onclick="deleteEmp('${id}')">삭제</button>`:''}<span></span><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="saveEmp(${id?`'${id}'`:'null'})">저장</button></div>`);
}
async function saveEmp(id){
  const f={no:$('#efNo').value.trim(),name:$('#efName').value.trim(),dept:$('#efDept').value.trim(),rank:$('#efRank').value.trim(),hire:$('#efHire').value,resign:$('#efResign').value||''};
  if(!f.name||!f.hire) return toast('이름과 입사일은 필수예요.');
  const dupNo=empList().find(x=>x.id!==id && f.no && String(x.no)===f.no); if(dupNo) return toast(`사번 ${f.no}은(는) ${dupNo.name}님이 쓰고 있어요.`);
  try{
    if(id){ const e=S.emps[id], Y=S.year, chg=$('#efChg').value||todayStr(), hist=[...(e.history||[])];
      ['dept','rank'].forEach(k=>{ if((e[k]||'')!==f[k]) hist.push({date:chg,field:k,from:e[k]||'',to:f[k],at:new Date().toISOString()}); });
      const adjV=$('#efAdj').value, mu=$('#efMU').value, mu0=$('#efMU0').value;
      const adj={...(e.adj||{})}; if(adjV===''||+adjV===0) delete adj[Y]; else adj[Y]={days:+adjV,memo:$('#efAdjM').value.trim()};
      const manualUsed={...(e.manualUsed||{})}; mu===''?delete manualUsed[Y]:manualUsed[Y]=+mu; mu0===''?delete manualUsed[Y-1]:manualUsed[Y-1]=+mu0;
      const data={...f,history:hist,adj,manualUsed,updatedAt:new Date().toISOString()};
      const merged={...stripId(e),...data};
      await db.collection('emps').doc(id).set(merged);
      S.emps[id]={id,...merged};
    } else { const data={...f,history:[],adj:{},manualUsed:{},createdAt:new Date().toISOString()}; const r=await db.collection('emps').add(data); S.emps[r.id]={id:r.id,...data}; }
    closeModal(); toast('저장했습니다.'); buildYearSelect(); render();
  }catch(err){ toast('저장 실패: '+err.message); }
}
const stripId = o => { const {id,...rest}=o; return rest; };
async function deleteEmp(id){ const e=S.emps[id], n=leavesOf(id).length;
  if(!confirm(`${e.name}님을 삭제할까요?${n?`\n휴가 기록 ${n}건도 함께 삭제됩니다.`:''}\n퇴사자는 삭제하지 말고 퇴사일을 입력하세요.`)) return;
  busy(true); try{ await commitBatch([...leavesOf(id).map(l=>({ref:db.collection('leaves').doc(l.id),del:true})),{ref:db.collection('emps').doc(id),del:true}]);
    leavesOf(id).forEach(l=>delete S.leaves[l.id]); delete S.emps[id]; closeModal(); toast('삭제했습니다.'); render(); }catch(err){ toast('삭제 실패: '+err.message); } busy(false); }

}

/* ================= 8. 설정 (공휴일, 초기 가져오기, 비교) ================= */
function renderSettings(v){
  const hol=[...S.hol].sort(), cmp=empList().filter(e=>e.ref && e.ref.year===S.year && !e.resign);
  const allDiff=cmp.map(e=>({e,s:sumOf(e)})).filter(x=>x.s && Math.abs(x.s.avail-x.e.ref.q)>1e-9);
  // '시스템 값 유지'로 확인한 값과 지금 계산값이 같으면 확인 완료로 보고 숨김 (계산값이 바뀌면 다시 나타남)
  const isKept=x=>x.e.ref.kept!==undefined && x.e.ref.kept!==null && Math.abs(x.e.ref.kept-x.s.avail)<1e-9;

  const row=({e,s},isK)=>{ const base=s.avail-s.adj, d=e.ref.q-base; return `<tr class="${isK?'kept':''}"><td class="l"><b>${esc(e.name)}</b></td><td>${e.hire}</td><td>${num(e.ref.q)}</td><td class="b">${num(s.avail)}</td>
     <td class="l small">이월 ${num(s.carry)} + 월차 ${num(s.monthly)} + 연차 ${num(s.grant)}${s.adj?` + 조정 ${num(s.adj)}`:''}${!isK&&e.hire.startsWith(String(S.year-1))?` <button class="link" onclick="empModal('${e.id}')">전년 사용일 입력</button>`:''}</td>
     <td>${num(e.ref.q-s.avail)}</td><td class="acts">${isK?`<span class="muted small">시스템 값 유지</span><button class="link" onclick="keepSystem('${e.id}',null)">되돌리기</button>`
       :`<button class="btn sm" onclick="keepSystem('${e.id}',${s.avail})">시스템 값 유지</button><button class="btn sm ghost" onclick="matchExcel('${e.id}',${d})">엑셀 값으로 맞춤</button>`}</td></tr>`; };
  const head='<table class="grid list"><thead><tr><th class="l">이름</th><th>입사일</th><th>엑셀</th><th>시스템</th><th class="l">시스템 계산 내역</th><th>엑셀−시스템</th><th></th></tr></thead><tbody>';
  v.innerHTML=`<section class="settings">
   <article><h2>기존 관리대장에서 사원 불러오기</h2><p class="muted">_26년연차휴가관리.xlsx의 <b>명부</b>와 <b>회계일기준</b> 시트를 읽어 사원을 등록해요. 처음 한 번만 하면 돼요.</p>
    <input type="file" id="impFile" accept=".xlsx,.xls"><div id="impArea">${S.imp?impTable():''}</div></article>
   <article><h2>기존 엑셀 값과 비교 <small>${S.year}년 사용가능 연차</small></h2>
    ${!cmp.length?'<p class="muted">사원을 불러오면 기존 엑셀의 사용가능 연차(Q열)와 비교해서 보여드려요.</p>'
     :(diffs.length?`<p class="muted">확인이 필요한 ${diffs.length}명이에요. <b>시스템 값 유지</b>를 누르면 지금 값으로 확정되고 목록에서 빠져요. <b>엑셀 값으로 맞춤</b>은 차이만큼 조정값을 넣어요.</p>${head}${diffs.map(x=>row(x,false)).join('')}</tbody></table>`
       :'<p class="empty ok">확인할 항목이 없어요.</p>')
     +(kept.length?`<details ${S.showKept?'open':''} ontoggle="S.showKept=this.open"><summary>시스템 값 유지로 확인한 항목 ${kept.length}명 보기</summary>${head}${kept.map(x=>row(x,true)).join('')}</tbody></table></details>`:'')}</article>
   <article><h2>공휴일</h2><p class="muted">휴가일수 계산에서 주말과 함께 빠지는 날짜예요. 한 줄에 하나씩 YYYY-MM-DD로 적어주세요. 대체공휴일·임시공휴일은 직접 추가하세요.</p>
    <textarea id="holTxt" rows="8">${hol.join('\n')}</textarea><div class="actions"><span></span><button class="btn" onclick="saveHol()">공휴일 저장</button></div></article>
   <article><h2>보안 안내</h2><ul class="sec"><li>Firestore 보안 규칙은 허용된 이메일(${ALLOWED.map(esc).join(', ')})만 읽기·쓰기가 되도록 설정되어 있어야 해요. <code>allow read, write: if true</code>는 절대 쓰지 마세요.</li>
    <li>로그인 계정을 추가할 땐 이 파일의 <code>ALLOWED</code> 목록과 Firestore 규칙의 이메일 목록을 함께 바꿔주세요.</li>

async function saveHol(){ const arr=[...new Set($('#holTxt').value.split(/[\s,]+/).map(normDate).filter(Boolean))].sort();
  try{ await db.collection('settings').doc('main').set({holidays:arr},{merge:true}); S.hol=new Set(arr); toast(`공휴일 ${arr.length}일 저장 — 이후 반영·수정분부터 적용돼요.`); render(); }catch(e){ toast('저장 실패: '+e.message); } }
async function keepSystem(id,val){ const e=S.emps[id]; const ref={...e.ref,kept:val};
  try{ await db.collection('emps').doc(id).set({ref},{merge:true}); e.ref=ref; toast(val===null?`${e.name} 확인을 되돌렸어요.`:`${e.name} 시스템 값 ${num(val)}일로 확정했어요.`); render(); }catch(err){ toast('저장 실패: '+err.message); } }
async function matchExcel(id,d){ const e=S.emps[id], Y=S.year; const adj={...(e.adj||{})};
  if(Math.abs(d)<1e-9) delete adj[Y]; else adj[Y]={days:d,memo:'기존 엑셀 값에 맞춤'};
  try{ await db.collection('emps').doc(id).set({adj},{merge:true}); e.adj=adj; toast(`${e.name} 조정 ${num(d)}일 반영`); render(); }catch(err){ toast('저장 실패: '+err.message); } }

async function readImport(file){
  busy(true,'관리대장 읽는 중');
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const mb=wb.Sheets['명부'], lg=wb.Sheets['회계일기준']; if(!lg) throw new Error('회계일기준 시트가 없습니다.');
    const led={}; XLSX.utils.sheet_to_json(lg,{header:1,raw:true,defval:''}).forEach(r=>{ const n=String(r[2]||'').trim(); const h=normDate(r[5]);
      if(n && h && /^\d+$/.test(String(r[1]).trim())) led[n]={no:String(r[1]).trim(),dept:r[3],rank:r[4],hire:h,O:+r[14]||0,Q:typeof r[16]==='number'?r[16]:null}; });
    const roster={}; if(mb) XLSX.utils.sheet_to_json(mb,{header:1,raw:true,defval:''}).slice(1).forEach(r=>{ const n=String(r[1]||'').trim(); if(n&&r[0]) roster[n]={no:String(r[0]).trim(),dept:r[2],rank:r[3],hire:normDate(r[4])}; });
    const names=[...new Set([...Object.keys(roster),...Object.keys(led)])];
    const exist=new Set(empList().map(e=>e.name));
    const ledYear=+(normDate(XLSX.utils.sheet_to_json(lg,{header:1,raw:true})[0]?.[4])||'').slice(0,4)||S.year;
    S.imp={ledYear, rows:names.map(n=>{ const R=roster[n]||{}, L=led[n]||{};
      const notes=[]; if(!led[n]) notes.push('관리대장에 없음'); if(!roster[n]) notes.push('명부에 없음');
      if(R.no&&L.no&&R.no!==L.no) notes.push(`사번 대장 ${L.no}`); if(R.dept&&L.dept&&R.dept!==L.dept) notes.push(`부서 대장 ${L.dept}`);
      if(R.hire&&L.hire&&R.hire!==L.hire) notes.push(`입사일 명부 ${R.hire}`);
      const hire=L.hire||R.hire||'';
      return { name:n, no:R.no||L.no||'', dept:R.dept||L.dept||'', rank:R.rank||L.rank||'', hire, prevUsed:L.O||0, q:L.Q,
        notes, inc:!!led[n] && !exist.has(n), exists:exist.has(n), newHire: hire.startsWith(String(ledYear-1)) }; }).sort((a,b)=>(b.notes.length-a.notes.length)||a.name.localeCompare(b.name)) };
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다: '+e.message); }
  busy(false); renderSettings($('#view'));
}
function impTable(){ const I=S.imp, Y1=I.ledYear-1;
  return `<p class="muted small">사번·부서는 <b>명부</b>, 입사일은 <b>관리대장</b> 값을 기본으로 넣었어요. 다르면 오른쪽에 표시되니 확인 후 고쳐주세요. ${Y1}년 입사자는 <b>${Y1}년 사용일수</b>가 있어야 이월 월차가 정확히 계산돼요(대장 O열 값을 넣어뒀어요).</p>
  <div class="tblwrap"><table class="grid list imp"><thead><tr><th>등록</th><th class="l">이름</th><th>사번</th><th>부서</th><th>직급</th><th>입사일</th><th>${Y1}년 사용</th><th class="l">확인할 점</th></tr></thead><tbody>
  ${I.rows.map((r,i)=>`<tr class="${r.notes.length?'note':''}"><td>${r.exists?'<small>등록됨</small>':`<input type="checkbox" ${r.inc?'checked':''} onchange="S.imp.rows[${i}].inc=this.checked">`}</td><td class="l"><b>${esc(r.name)}</b></td>
   ${['no','dept','rank'].map(k=>`<td><input value="${esc(r[k])}" onchange="S.imp.rows[${i}].${k}=this.value.trim()"></td>`).join('')}
   <td><input type="date" value="${r.hire}" onchange="S.imp.rows[${i}].hire=this.value;S.imp.rows[${i}].newHire=this.value.startsWith('${Y1}')"></td>
   <td>${r.newHire?`<input type="number" step="0.5" class="n" value="${r.prevUsed}" onchange="S.imp.rows[${i}].prevUsed=+this.value">`:''}</td><td class="l small">${r.notes.map(esc).join(' · ')}</td></tr>`).join('')}</tbody></table></div>
  <div class="actions"><span></span><button class="btn ghost" onclick="S.imp=null;render()">취소</button><button class="btn" onclick="commitImport()">선택한 ${I.rows.filter(r=>r.inc&&!r.exists).length}명 등록</button></div>`; }
async function commitImport(){
  const I=S.imp, rows=I.rows.filter(r=>r.inc&&!r.exists), Y1=I.ledYear-1, now=new Date().toISOString();
  const bad=rows.filter(r=>!r.hire); if(bad.length) return toast(`입사일이 없는 직원: ${bad.map(r=>r.name).join(', ')}`);
  const nos={}; for(const r of rows) if(r.no){ if(nos[r.no]) return toast(`사번 ${r.no} 중복: ${nos[r.no]}, ${r.name}`); nos[r.no]=r.name; }
  const ops=[], add=[];
  rows.forEach(r=>{ const ref=db.collection('emps').doc(); const data={no:r.no,name:r.name,dept:r.dept,rank:r.rank,hire:r.hire,resign:'',history:[],adj:{},
    manualUsed: r.newHire&&r.prevUsed ? {[Y1]:r.prevUsed} : {}, ref: r.q!==null&&r.q!==undefined ? {year:I.ledYear,q:r.q} : null, createdAt:now};
    ops.push({ref,data,merge:false}); add.push([ref.id,data]); });
  busy(true,`${rows.length}명 등록 중`);
  try{ await commitBatch(ops); add.forEach(([id,d])=>S.emps[id]={id,...d}); S.imp=null; toast(`${rows.length}명을 등록했습니다.`); buildYearSelect(); render(); }
  catch(e){ toast('등록 실패: '+e.message); }
  busy(false);
}

/* ================= 엑셀 다운로드 ================= */
function exportYear(Y){
  const T=todayStr(), lastM = Y<+T.slice(0,4)?12:(Y>+T.slice(0,4)?12:+T.slice(5,7));
  const wb=XLSX.utils.book_new();
  const hdS={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1E7F76'}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:bd()};
  const cS={alignment:{horizontal:'center'},border:bd()}, lS={border:bd()};
  const KF={annual:'CDEFEA',special:'F3EBC2',official:'D6E4F0',condolence:'E3DDF0',sick:'DFE4E8',maternity:'F0DDE8',childcare:'F0DDE8'};
  function bd(){ const s={style:'thin',color:{rgb:'C9D4D2'}}; return {top:s,bottom:s,left:s,right:s}; }
  function sheet(aoa,styleFn,cols,merges){ const ws=XLSX.utils.aoa_to_sheet(aoa);
    for(const a in ws){ if(a[0]==='!') continue; const {r,c}=XLSX.utils.decode_cell(a); ws[a].s=styleFn(r,c,ws[a].v); }
    ws['!cols']=cols; if(merges) ws['!merges']=merges; return ws; }
  // 1) 연차 현황
  const emps=empList().filter(e=>e.hire&&+e.hire.slice(0,4)<=Y&&(!e.resign||+e.resign.slice(0,4)>=Y)).sort(empSort);
  const H=['사번','성명','부서','직급','입사일','퇴사일','근속','이월월차','월차','연차','조정','조정사유','사용가능',...[...Array(12)].map((_,i)=>`${i+1}월`),'사용합계','잔여','초과','수당대상'];
  const rows=emps.map(e=>{ const s=summaryOf(e,Y,asOfFor(Y),okLeavesOf(e.id)); return [e.no,e.name,e.dept,e.rank,e.hire,e.resign||'',`${s.N}년차`,s.carry,s.monthly,s.grant,s.adj,e.adj?.[Y]?.memo||'',s.avail,...s.months,s.used,Math.max(0,s.remain),Math.max(0,-s.remain),s.payRemain]; });
  const a1=[[`${Y}년 사원별 연차휴가 관리대장 (회계일 기준) — 기준일 ${asOfFor(Y)}`],H,...rows];
  XLSX.utils.book_append_sheet(wb,sheet(a1,(r,c)=>r===0?{font:{bold:true,sz:14}}:r===1?hdS:(c===1||c===2||c===11?lS:cS),
    H.map((h,i)=>({wch:i===11?16:i===1||i===2?10:i>=13&&i<=24?5:8})),[{s:{r:0,c:0},e:{r:0,c:10}}]),'연차현황');
  // 2) 월별 근태
  for(let M=1;M<=lastM;M++){
    const {days,emps:me,map}=monthCells(Y,M);
    const head=['사번','부서','직급','이름',...days.map(d=>`${+d.slice(8)}(${'일월화수목금토'[dow(d)]})`),'연차','반차','특별','공가','기타'];
    const kindAt={}; const data=me.map((e,ri)=>{ const c=[0,0,0,0,0];
      const cells=days.map((d,ci)=>{ const it=map[e.id+'|'+d]||[]; it.forEach(({l,x})=>{ if(l.kind==='annual') x.a<1?c[1]++:c[0]++; else if(l.kind==='special') c[2]+=x.a; else if(l.kind==='official') c[3]+=x.a; else c[4]+=x.a; });
        if(it.length) kindAt[(ri+2)+'|'+(ci+4)]=it[0].l.kind; return it.map(({l,x})=>dayCode(l.kind,x.a)+(l.kind==='annual'&&x.a<1?(x.p==='오전'?'전':'후'):'')).join('/'); });
      return [e.no,e.dept,e.rank,e.name,...cells,...c.map(n=>n||'')]; });
    const aoa=[[`${Y}년 ${M}월 사원별 연차이력`],head,...data];
    const ws=sheet(aoa,(r,c)=>{ if(r===0) return {font:{bold:true,sz:13}}; if(r===1){ const d=days[c-4]; const off=d&&isOff(d,S.hol); return {...hdS,fill:{fgColor:{rgb:off?'8FA6A3':'1E7F76'}}}; }
      const k=kindAt[r+'|'+c]; const d=days[c-4]; const off=d&&isOff(d,S.hol);
      return {...cS,font:k?{bold:true}:{},fill:k?{fgColor:{rgb:KF[k]}}:(off?{fgColor:{rgb:'EEF2F1'}}:undefined)}; },
      head.map((h,i)=>({wch:i<4?(i===3?8:9):i>=head.length-5?5:4.2})),[{s:{r:0,c:0},e:{r:0,c:10}}]);
    XLSX.utils.book_append_sheet(wb,ws,`${M}월`);
  }
  // 3) 사용 내역
  const L=Object.values(S.leaves).filter(l=>l.status==='ok'&&l.dates.some(x=>x.d.startsWith(Y+'-'))).sort((a,b)=>a.start.localeCompare(b.start));
  const H3=['이름','부서','시작일','종료일','종류','일수(해당연도)','주말포함','제목','기안일','문서번호','메모'];
  const a3=[H3,...L.map(l=>{ const e=S.emps[l.empId]||{}; return [e.name||l.name,e.dept||'',l.start,l.end,KINDS[l.kind]?.label,sumDays(l.dates.filter(x=>x.d.startsWith(Y+'-'))),l.weekend?'Y':'',l.title||'',l.draft||'',l.docNo||'직접입력',l.memo||'']; })];
  XLSX.utils.book_append_sheet(wb,sheet(a3,(r,c)=>r===0?hdS:(c===7||c===10?lS:cS),H3.map((h,i)=>({wch:i===7?60:i===9?18:11}))),'사용내역');
  // 4) 퇴사자
  const R=retiredEmps(); if(R.length){
    const H4=['이름','사번','부서','입사일','퇴사일','연도','발생연차','월차','이월월차','사용','잔여','수당대상'];
    const a4=[H4]; R.forEach(e=>yearlyRows(e).forEach(r=>a4.push([e.name,e.no,e.dept,e.hire,e.resign,r.Y,r.grant+r.adj,r.monthly,r.carry,r.used,r.remain,r.payRemain])));
    XLSX.utils.book_append_sheet(wb,sheet(a4,(r)=>r===0?hdS:cS,H4.map(()=>({wch:11}))),'퇴사자');
  }
  XLSX.writeFile(wb,`${Y}년_연차휴가관리_${T.replace(/-/g,'')}.xlsx`);
  toast(`${Y}년 엑셀을 내려받았어요 (1~${lastM}월).`);
}
